<html lang="zh-CN">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO 管理中心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-number {
            font-size: 3em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
            font-size: 1.1em;
        }

        /* 详细统计区域 */
        .detailed-stats {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .detailed-stats h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .stats-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
        }

        .stats-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 8px 0;
        }

        .stat-item-label {
            font-weight: 500;
            color: #555;
        }

        .stat-item-value {
            font-weight: bold;
            color: #667eea;
            font-size: 1.1em;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 5px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
        }

        .priority-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .priority-P0 { background: #dc3545; }
        .priority-P1 { background: #fd7e14; }
        .priority-P2 { background: #ffc107; }
        .priority-P3 { background: #28a745; }

        .completion-rate {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            margin-top: 15px;
        }

        .completion-rate .rate-number {
            font-size: 3em;
            font-weight: bold;
            margin: 10px 0;
        }

        .overdue-alert {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
        }

        .overdue-alert.critical {
            background: #f8d7da;
            border-left-color: #dc3545;
        }

        .filters {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group label {
            font-weight: bold;
            color: #333;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }

        .filter-btn:hover {
            background: #f0f0f0;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
        }

        .workspace-section {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            overflow: hidden;
        }

        .workspace-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            font-size: 1.5em;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            transition: all 0.3s ease;
        }

        .workspace-header:hover {
            opacity: 0.9;
        }

        .workspace-header .toggle-icon {
            font-size: 1.2em;
            transition: transform 0.3s ease;
        }

        .workspace-section.collapsed .workspace-header .toggle-icon {
            transform: rotate(-90deg);
        }

        .workspace-content {
            padding: 20px;
            max-height: 2000px;
            overflow: hidden;
            transition: max-height 0.5s ease, padding 0.5s ease;
        }

        .workspace-section.collapsed .workspace-content {
            max-height: 0;
            padding: 0 20px;
        }

        .task-group {
            margin-bottom: 30px;
        }

        .task-group-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            transition: all 0.3s ease;
        }

        .task-group-title:hover {
            opacity: 0.8;
        }

        .task-group-title .toggle-icon {
            font-size: 0.8em;
            transition: transform 0.3s ease;
        }

        .task-group.collapsed .task-group-title .toggle-icon {
            transform: rotate(-90deg);
        }

        .task-group .task-list {
            max-height: 2000px;
            overflow: hidden;
            transition: max-height 0.5s ease;
        }

        .task-group.collapsed .task-list {
            max-height: 0;
        }

        .task-list {
            display: grid;
            gap: 10px;
        }

        .task-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .task-card:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .task-card.priority-P0 {
            border-left-color: #dc3545;
        }

        .task-card.priority-P1 {
            border-left-color: #fd7e14;
        }

        .task-card.priority-P2 {
            border-left-color: #ffc107;
        }

        .task-card.priority-P3 {
            border-left-color: #28a745;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .task-text {
            font-size: 1.1em;
            color: #333;
            flex: 1;
        }

        .task-meta {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .time-info {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
            font-size: 0.85em;
            color: #666;
        }

        .time-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            border-radius: 4px;
            background: #e9ecef;
        }

        .time-badge.created {
            background: #d1ecf1;
            color: #0c5460;
        }

        .time-badge.due {
            background: #fff3cd;
            color: #856404;
        }

        .time-badge.completed {
            background: #d4edda;
            color: #155724;
        }

        .time-badge.overdue {
            background: #f8d7da;
            color: #721c24;
            animation: pulse 2s infinite;
        }

        .duration-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            border-radius: 4px;
            background: #e2e3e5;
            color: #383d41;
            font-size: 0.85em;
        }

        .priority-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: bold;
            color: white;
        }

        .priority-badge.P1 { background: #fd7e14; }
        .priority-badge.P2 { background: #ffc107; color: #333; }
        .priority-badge.P3 { background: #28a745; }

        .date-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            background: #6c757d;
            color: white;
        }

        .date-badge.overdue {
            background: #dc3545;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .tag-list {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .tag {
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.8em;
            background: #e9ecef;
            color: #495057;
        }

            text-align: center;
            color: #999;
            padding: 40px;
            font-size: 1.2em;
        }

        footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .stat-number {
                font-size: 2em;
            }

            .task-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>

    <div class="container">
        <header>
            <h1>📋 TODO 管理中心</h1>
            <p>跨工作区任务管理平台</p>
        </header>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="total-tasks">0</div>
                <div class="stat-label">总任务数</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="in-progress">0</div>
                <div class="stat-label">进行中</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="pending">0</div>
                <div class="stat-label">待办</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="completed">0</div>
                <div class="stat-label">已完成</div>
            </div>
        </div>

        <!-- 详细统计展示区域 -->
        <div class="detailed-stats">
            <h2>📊 详细统计</h2>
            <div class="stats-grid">
                <!-- 按优先级统计 -->
                <div class="stats-section">
                    <h3>按优先级分布</h3>
                    <div id="priority-stats"></div>
                </div>

                <!-- 按工作区统计 -->
                <div class="stats-section">
                    <h3>按工作区分布</h3>
                    <div id="workspace-stats"></div>
                </div>

                <!-- 完成率统计 -->
                <div class="stats-section">
                    <h3>完成率</h3>
                    <div class="completion-rate">
                        <div>当前完成率</div>
                        <div class="rate-number" id="completion-rate">0%</div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="completion-progress" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <!-- 逾期任务 -->
                <div class="stats-section">
                    <h3>逾期任务</h3>
                    <div id="overdue-stats"></div>
                </div>
            </div>
        </div>

        <div class="filters">
            <div class="filter-group">
                <label>工作区：</label>
                <button class="filter-btn workspace-filter active" data-workspace="all">全部</button>
                <!-- 工作区按钮将通过 JavaScript 动态生成 -->
            </div>
            <div class="filter-group">
                <label>优先级：</label>
                <button class="filter-btn priority-filter active" data-filter="all">全部</button>
                <button class="filter-btn priority-filter" data-filter="P0">P0 紧急</button>
                <button class="filter-btn priority-filter" data-filter="P1">P1 重要</button>
                <button class="filter-btn priority-filter" data-filter="P2">P2 一般</button>
                <button class="filter-btn priority-filter" data-filter="P3">P3 可选</button>
            </div>
            <div class="filter-group" style="margin-top: 15px;">
                <label>视图：</label>
                <button class="filter-btn" id="collapse-all">全部折叠</button>
                <button class="filter-btn" id="expand-all">全部展开</button>
            </div>
        </div>

        <div id="workspaces-container">
            <!-- 工作区内容将通过 JavaScript 动态生成 -->
        </div>

        <footer>
            <p>最后更新: <span id="last-update"></span></p>
            <p>Powered by TODO Management System</p>
        </footer>
    </div>

        let currentFilter = 'all';
        let currentWorkspaceFilter = 'all';

        function init() {
            generateWorkspaceFilters();
            updateStats();
            renderDetailedStats();
            renderWorkspaces();
            setupFilters();
            setupCollapseButtons();
            
            // 使用构建时间而不是页面加载时间
            const buildTime = new Date(TODO_DATA.generated_at);
            document.getElementById('last-update').textContent = buildTime.toLocaleString('zh-CN');
        }

        function generateWorkspaceFilters() {
            const filterContainer = document.querySelector('.filter-group:first-child');
            TODO_DATA.workspaces.forEach(workspace => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn workspace-filter';
                btn.dataset.workspace = workspace.name;
                btn.textContent = workspace.name;
                filterContainer.appendChild(btn);
            });
        }

        function updateStats() {
            let total = 0, inProgress = 0, pending = 0, completed = 0;
            
            TODO_DATA.workspaces.forEach(workspace => {
                // 应用工作区筛选
                if (currentWorkspaceFilter !== 'all' && workspace.name !== currentWorkspaceFilter) {
                    return;
                }
                
                workspace.sections.forEach(section => {
                    section.tasks.forEach(task => {
                        total++;
                        if (section.status === '进行中') inProgress++;
                        else if (section.status === '待办') pending++;
                        else if (section.status === '已完成') completed++;
                    });
                });
            });

            document.getElementById('total-tasks').textContent = total;
            document.getElementById('in-progress').textContent = inProgress;
            document.getElementById('pending').textContent = pending;
            document.getElementById('completed').textContent = completed;
        }

        function renderDetailedStats() {
            // 统计优先级分布
            const priorityCounts = { P0: 0, P1: 0, P2: 0, P3: 0 };
            const workspaceCounts = {};
            let overdueCount = 0;
            let totalTasks = 0;
            let completedTasks = 0;
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            TODO_DATA.workspaces.forEach(workspace => {
                // 应用工作区筛选
                if (currentWorkspaceFilter !== 'all' && workspace.name !== currentWorkspaceFilter) {
                    return;
                }

                // 统计工作区任务数
                let workspaceTaskCount = 0;
                
                workspace.sections.forEach(section => {
                    section.tasks.forEach(task => {
                        totalTasks++;
                        workspaceTaskCount++;
                        
                        if (section.status === '已完成') {
                            completedTasks++;
                        }

                        // 统计优先级
                        if (task.priority && priorityCounts.hasOwnProperty(task.priority)) {
                            priorityCounts[task.priority]++;
                        }

                        // 检查逾期（未完成任务且有截止日期）
                        if (section.status !== '已完成' && task.dueDate) {
                            const dueDate = new Date(task.dueDate);
                            dueDate.setHours(0, 0, 0, 0);
                            if (dueDate < today) {
                                overdueCount++;
                            }
                        }
                    });
                });

                workspaceCounts[workspace.name] = workspaceTaskCount;
            });

            // 渲染优先级统计
            const priorityContainer = document.getElementById('priority-stats');
            priorityContainer.innerHTML = '';
            const totalWithPriority = Object.values(priorityCounts).reduce((a, b) => a + b, 0);
            
            ['P0', 'P1', 'P2', 'P3'].forEach(priority => {
                const count = priorityCounts[priority];
                const percentage = totalWithPriority > 0 ? (count / totalWithPriority * 100).toFixed(1) : 0;
                
                const item = document.createElement('div');
                item.className = 'stat-item';
                item.innerHTML = `
                    <span class="stat-item-label">
                        <span class="priority-indicator priority-${priority}"></span>
                        ${priority} 优先级
                    </span>
                    <span class="stat-item-value">${count} (${percentage}%)</span>
                `;
                priorityContainer.appendChild(item);

                // 添加进度条
                const progressBar = document.createElement('div');
                progressBar.className = 'progress-bar';
                progressBar.innerHTML = `<div class="progress-fill" style="width: ${percentage}%"></div>`;
                priorityContainer.appendChild(progressBar);
            });

            // 渲染工作区统计
            const workspaceContainer = document.getElementById('workspace-stats');
            workspaceContainer.innerHTML = '';
            
            Object.entries(workspaceCounts).forEach(([name, count]) => {
                const percentage = totalTasks > 0 ? (count / totalTasks * 100).toFixed(1) : 0;
                
                const item = document.createElement('div');
                item.className = 'stat-item';
                item.innerHTML = `
                    <span class="stat-item-label">${name}</span>
                    <span class="stat-item-value">${count} (${percentage}%)</span>
                `;
                workspaceContainer.appendChild(item);

                // 添加进度条
                const progressBar = document.createElement('div');
                progressBar.className = 'progress-bar';
                progressBar.innerHTML = `<div class="progress-fill" style="width: ${percentage}%"></div>`;
                workspaceContainer.appendChild(progressBar);
            });

            // 渲染完成率
            const completionRate = totalTasks > 0 ? (completedTasks / totalTasks * 100).toFixed(1) : 0;
            document.getElementById('completion-rate').textContent = `${completionRate}%`;
            document.getElementById('completion-progress').style.width = `${completionRate}%`;

            // 渲染逾期任务
            const overdueContainer = document.getElementById('overdue-stats');
            overdueContainer.innerHTML = '';
            
            const overdueItem = document.createElement('div');
            overdueItem.className = `overdue-alert ${overdueCount > 0 ? 'critical' : ''}`;
            overdueItem.innerHTML = `
                <div style="font-size: 1.5em; font-weight: bold; margin-bottom: 10px;">
                    ${overdueCount > 0 ? '⚠️' : '✅'} ${overdueCount} 个逾期任务
                </div>
                <div style="color: #666;">
                    ${overdueCount > 0 ? '需要立即关注和处理' : '所有任务都在计划时间内'}
                </div>
            `;
            overdueContainer.appendChild(overdueItem);
        }

        function renderWorkspaces() {
            const container = document.getElementById('workspaces-container');
            container.innerHTML = '';

            TODO_DATA.workspaces.forEach(workspace => {
                // 应用工作区筛选
                if (currentWorkspaceFilter !== 'all' && workspace.name !== currentWorkspaceFilter) {
                    return;
                }
                
                const section = document.createElement('div');
                section.className = 'workspace-section';
                
                const header = document.createElement('div');
                header.className = 'workspace-header';
                
                const titleSpan = document.createElement('span');
                titleSpan.textContent = workspace.name;
                header.appendChild(titleSpan);
                
                const toggleIcon = document.createElement('span');
                toggleIcon.className = 'toggle-icon';
                toggleIcon.textContent = '▼';
                header.appendChild(toggleIcon);
                
                // 添加点击事件
                header.addEventListener('click', () => {
                    section.classList.toggle('collapsed');
                });
                
                section.appendChild(header);

                const content = document.createElement('div');
                content.className = 'workspace-content';

                workspace.sections.forEach(taskSection => {
                    const filteredTasks = taskSection.tasks.filter(task => {
                        if (currentFilter === 'all') return true;
                        return task.priority === currentFilter;
                    });

                    if (filteredTasks.length === 0) return;

                    const group = document.createElement('div');
                    group.className = 'task-group';

                    const title = document.createElement('div');
                    title.className = 'task-group-title';
                    
                    const titleText = document.createElement('span');
                    const statusEmoji = taskSection.status === '进行中' ? '🔴' : 
                                       taskSection.status === '待办' ? '🟡' : '🟢';
                    titleText.textContent = `${statusEmoji} ${taskSection.status} ${taskSection.title ? '(' + taskSection.title + ')' : ''}`;
                    title.appendChild(titleText);
                    
                    const groupToggleIcon = document.createElement('span');
                    groupToggleIcon.className = 'toggle-icon';
                    groupToggleIcon.textContent = '▼';
                    title.appendChild(groupToggleIcon);
                    
                    // 添加点击事件
                    title.addEventListener('click', () => {
                        group.classList.toggle('collapsed');
                    });
                    
                    group.appendChild(title);

                    const taskList = document.createElement('div');
                    taskList.className = 'task-list';

                    filteredTasks.forEach(task => {
                        const taskCard = createTaskCard(task);
                        taskList.appendChild(taskCard);
                    });

                    group.appendChild(taskList);
                    content.appendChild(group);
                });

                if (content.children.length === 0) {
                    const noTasks = document.createElement('div');
                    noTasks.className = 'no-tasks';
                    noTasks.textContent = '暂无任务';
                    content.appendChild(noTasks);
                }

                section.appendChild(content);
                container.appendChild(section);
            });
        }

        function createTaskCard(task) {
            const card = document.createElement('div');
            card.className = `task-card priority-${task.priority || 'P2'}`;

            const header = document.createElement('div');
            header.className = 'task-header';

            const text = document.createElement('div');
            text.className = 'task-text';
            text.textContent = task.text;
            header.appendChild(text);

            const meta = document.createElement('div');
            meta.className = 'task-meta';

            if (task.priority) {
                const priorityBadge = document.createElement('span');
                priorityBadge.className = `priority-badge ${task.priority}`;
                priorityBadge.textContent = task.priority;
                meta.appendChild(priorityBadge);
            }

            header.appendChild(meta);
            card.appendChild(header);

            // 添加时间信息
            const timeInfo = document.createElement('div');
            timeInfo.className = 'time-info';

            // 创建日期
            if (task.createdDate) {
                const createdBadge = document.createElement('span');
                createdBadge.className = 'time-badge created';
                createdBadge.textContent = `📅 创建: ${task.createdDate}`;
                timeInfo.appendChild(createdBadge);
            }

            // 截止日期（未完成任务）
            if (!task.completed && task.dueDate) {
                const dueBadge = document.createElement('span');
                const dueDate = new Date(task.dueDate);
                const today = new Date();
                const isOverdue = dueDate < today;
                
                dueBadge.className = `time-badge due${isOverdue ? ' overdue' : ''}`;
                dueBadge.textContent = isOverdue ? `⚠️ 逾期: ${task.dueDate}` : `⏰ 截止: ${task.dueDate}`;
                timeInfo.appendChild(dueBadge);
            }

            // 完成日期（已完成任务）
            if (task.completed && task.completedDate) {
                const completedBadge = document.createElement('span');
                completedBadge.className = 'time-badge completed';
                completedBadge.textContent = `✅ 完成: ${task.completedDate}`;
                timeInfo.appendChild(completedBadge);
            }

            // 计算任务耗时（已完成任务且有创建日期和完成日期）
            if (task.completed && task.createdDate && task.completedDate) {
                const created = new Date(task.createdDate);
                const completed = new Date(task.completedDate);
                const durationMs = completed - created;
                const durationDays = Math.ceil(durationMs / (1000 * 60 * 60 * 24));
                
                const durationBadge = document.createElement('span');
                durationBadge.className = 'duration-badge';
                durationBadge.textContent = `⏱️ 耗时: ${durationDays}天`;
                timeInfo.appendChild(durationBadge);
            }

            // 计算任务年龄（未完成任务且有创建日期）
            if (!task.completed && task.createdDate) {
                const created = new Date(task.createdDate);
                const today = new Date();
                const ageMs = today - created;
                const ageDays = Math.floor(ageMs / (1000 * 60 * 60 * 24));
                
                if (ageDays > 0) {
                    const ageBadge = document.createElement('span');
                    ageBadge.className = 'duration-badge';
                    ageBadge.textContent = `📆 已${ageDays}天`;
                    timeInfo.appendChild(ageBadge);
                }
            }

            if (timeInfo.children.length > 0) {
                card.appendChild(timeInfo);
            }

            if (task.tags && task.tags.length > 0) {
                const tagList = document.createElement('div');
                tagList.className = 'tag-list';
                task.tags.forEach(tag => {
                    const tagElement = document.createElement('span');
                    tagElement.className = 'tag';
                    tagElement.textContent = tag;
                    tagList.appendChild(tagElement);
                });
                card.appendChild(tagList);
            }

            return card;
        }

        function setupFilters() {
            // 工作区筛选
            const workspaceBtns = document.querySelectorAll('.workspace-filter');
            workspaceBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    workspaceBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentWorkspaceFilter = btn.dataset.workspace;
                    updateStats();
                    renderDetailedStats();
                    renderWorkspaces();
                });
            });
            
            // 优先级筛选
            const priorityBtns = document.querySelectorAll('.priority-filter');
            priorityBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    priorityBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    updateStats();
                    renderDetailedStats();
                    renderWorkspaces();
                });
            });
        }

        function setupCollapseButtons() {
            const collapseAllBtn = document.getElementById('collapse-all');
            const expandAllBtn = document.getElementById('expand-all');
            
            collapseAllBtn.addEventListener('click', () => {
                document.querySelectorAll('.workspace-section').forEach(section => {
                    section.classList.add('collapsed');
                });
            });
            
            expandAllBtn.addEventListener('click', () => {
                document.querySelectorAll('.workspace-section').forEach(section => {
                    section.classList.remove('collapsed');
                });
            });
        }

        // 初始化
        init();
    </script>
